    <script>
      // Safe patch for environments/iframes where window.fetch has only a getter
      (function() {
        try {
          var _fetch = window.fetch;
          var customFetch = _fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch;
            },
            set: function(val) {
              customFetch = val;
            },
            configurable: true,
            enumerable: true
          });
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return customFetch;
                },
                set: function(val) {
                  customFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            } catch (protoErr) {}
          }
        } catch (e) {
          console.warn('Safe fetch patch applied with notice:', e);
        }
      })();
    </script>
